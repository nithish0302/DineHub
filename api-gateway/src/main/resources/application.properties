spring.application.name=api-gateway
server.port=9000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**


# Food Service
spring.cloud.gateway.server.webmvc.routes[1].id=food-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://foodService
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/foods/**


# Order Service
spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://orderService
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/orders/**


# Payment Service
spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://paymentService
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payment/**


# Notification Service
spring.cloud.gateway.server.webmvc.routes[4].id=notification-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://notificationService
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/notifications/**

jwt.secret=${JWT_SECRET}